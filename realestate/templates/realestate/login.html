{% extends 'realestate/base.html' %}
{% block title %}Login — RealEstateAI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="mb-4 text-center">Welcome Back</h3>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label class="form-label fw-semibold">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors|join:", " }}</div>{% endif %}
        </div>
        {% endfor %}
        <button class="btn btn-accent w-100 py-2" type="submit">Login</button>
      </form>
      <p class="text-center mt-3 text-muted">New here? <a href="{% url 'register' %}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
